name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    env:
      # Same-repo, non-dependabot PRs get ruff fixes pushed back to the PR branch.
      AUTO_FIX: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' }}

    steps:
      - name: Generate GitHub App token
        if: env.AUTO_FIX == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PANTHER_BOT_APP_ID }}
          private-key: ${{ secrets.PANTHER_BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      # Auto-fix checks out the PR branch with the App token so it can push; otherwise the default merge ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTO_FIX == 'true' && github.head_ref || '' }}
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: ${{ env.AUTO_FIX == 'true' }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system ruff

      - name: Format and fix code
        if: env.AUTO_FIX == 'true'
        run: |
          ruff format src
          ruff check --fix src

          # Check if there are any changes to commit
          if [ -n "$(git status --porcelain)" ]; then
            app_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
            git config user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
            git config user.name "${APP_SLUG}[bot]"
            git add src
            git commit -m "style: format and fix code with ruff"
            git push
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}

      - name: Check formatting
        run: |
          ruff format --check src

      - name: Run linter
        run: |
          ruff check src
